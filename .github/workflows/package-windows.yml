name: Package Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Resolve project version and architecture
        shell: pwsh
        run: |
          if (-not [Environment]::Is64BitProcess) {
            throw 'The Windows package must be built by a 64-bit Python process'
          }
          $projectVersion = python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to read the project version from pyproject.toml'
          }
          $projectVersion = "$projectVersion".Trim()
          $versionPattern = '^(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)(?:b(?<beta>[1-9]\d*))?$'
          if ($projectVersion -cnotmatch $versionPattern) {
            throw "Package version is not a supported stable or beta PEP 440 version: $projectVersion"
          }
          $releaseVersion = "$($Matches.major).$($Matches.minor).$($Matches.patch)"
          if ($Matches.beta) {
            $releaseVersion += "-beta.$($Matches.beta)"
          }
          "BDSUBMERGE_VERSION=$projectVersion" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BDSUBMERGE_RELEASE_VERSION=$releaseVersion" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify release tag and architecture
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $semver = '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
          if ($env:TAG_NAME -cnotmatch $semver) {
            throw "Release tag is not SemVer: $env:TAG_NAME"
          }
          if ($env:TAG_NAME.Substring(1) -cne $env:BDSUBMERGE_RELEASE_VERSION) {
            throw "Release tag $env:TAG_NAME does not match package version $env:BDSUBMERGE_VERSION"
          }
      - name: Install project
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -c constraints/ci.txt ".[gui,packaging]"
      - name: Build onedir package
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed
          --name BDSubMerge
          --collect-data bdsubmerge
          --collect-all shinya
          --collect-all pysubs2
          src/bdsubmerge/app.py
      - name: Include project license
        shell: pwsh
        run: Copy-Item LICENSE -Destination dist/BDSubMerge
      - name: Verify final package contents
        shell: pwsh
        run: |
          $required = @(
            'dist/BDSubMerge/BDSubMerge.exe',
            'dist/BDSubMerge/_internal/bdsubmerge/resources/i18n/en_US.json',
            'dist/BDSubMerge/_internal/bdsubmerge/resources/i18n/zh_CN.json',
            'dist/BDSubMerge/LICENSE'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Release file is missing: $path"
            }
          }
          foreach ($excluded in @('dist/BDSubMerge/LICENSES', 'dist/BDSubMerge/THIRD_PARTY_NOTICES.md')) {
            if (Test-Path -LiteralPath $excluded) {
              throw "Release package contains excluded license material: $excluded"
            }
          }
      - name: Create ZIP and SHA256
        shell: pwsh
        run: |
          $zipName = "BDSubMerge-$env:BDSUBMERGE_RELEASE_VERSION-windows-x64.zip"
          $zipPath = Join-Path dist $zipName
          Push-Location dist
          try {
            Compress-Archive -LiteralPath BDSubMerge -DestinationPath $zipName
          } finally {
            Pop-Location
          }
          $checksum = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zipPath.sha256" `
            -Value "$checksum  $zipName" -Encoding ascii
      - name: Smoke-test final archive without Python
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'BDSubMerge 最终包 无 Python'
          $workingDirectory = Join-Path $smokeRoot '运行工作目录'
          New-Item -ItemType Directory -Force -Path $smokeRoot,$workingDirectory | Out-Null
          $zipPath = "dist/BDSubMerge-$env:BDSUBMERGE_RELEASE_VERSION-windows-x64.zip"
          Expand-Archive -LiteralPath $zipPath `
            -DestinationPath $smokeRoot
          $executable = Join-Path $smokeRoot 'BDSubMerge/BDSubMerge.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Packaged executable is missing after extraction: $executable"
          }
          $env:PYTHONHOME = $null
          $env:PYTHONPATH = $null
          $env:PYTHONNOUSERSITE = '1'
          $env:VIRTUAL_ENV = $null
          $env:CONDA_PREFIX = $null
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $process = Start-Process -FilePath $executable `
            -ArgumentList '--smoke-test', '--expect-version', $env:BDSUBMERGE_VERSION `
            -WorkingDirectory $workingDirectory `
            -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged GUI and adapter smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Capture final executable visual evidence
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $executable = Join-Path $env:RUNNER_TEMP `
            'BDSubMerge 最终包 无 Python/BDSubMerge/BDSubMerge.exe'
          $workingDirectory = Join-Path $env:RUNNER_TEMP `
            'BDSubMerge 最终包 无 Python/运行工作目录'
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE 'reports/package-ui'
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          $captures = @(
            @('zh_CN', 'light', (Join-Path $evidenceRoot 'BDSubMerge-zh-light.png')),
            @('en_US', 'dark', (Join-Path $evidenceRoot 'BDSubMerge-en-dark.png'))
          )
          foreach ($capture in $captures) {
            $destination = $capture[2]
            $quotedDestination = '"' + $destination + '"'
            $process = Start-Process -FilePath $executable `
              -ArgumentList '--capture-screenshot', $quotedDestination, `
                '--locale', $capture[0], '--theme', $capture[1], `
                '--expect-version', $env:BDSUBMERGE_VERSION `
              -WorkingDirectory $workingDirectory `
              -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Packaged GUI screenshot failed with exit code $($process.ExitCode)"
            }
            if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) {
              throw "Packaged GUI screenshot is missing: $destination"
            }
            if ((Get-Item -LiteralPath $destination).Length -lt 30000) {
              throw "Packaged GUI screenshot lacks expected rendered detail: $destination"
            }
            Add-Type -AssemblyName System.Drawing
            $image = [System.Drawing.Image]::FromFile($destination)
            try {
              if ($image.Width -lt 1200 -or $image.Height -lt 800) {
                throw "Packaged GUI screenshot is too small: $($image.Width)x$($image.Height)"
              }
            } finally {
              $image.Dispose()
            }
          }
          $hashes = $captures | ForEach-Object {
            (Get-FileHash -LiteralPath $_[2] -Algorithm SHA256).Hash
          }
          if (($hashes | Select-Object -Unique).Count -ne $captures.Count) {
            throw 'Packaged GUI screenshots are not visually distinct'
          }
      - name: Verify release checksum
        shell: pwsh
        run: |
          $zipPath = "dist/BDSubMerge-$env:BDSUBMERGE_RELEASE_VERSION-windows-x64.zip"
          $checksumPath = "$zipPath.sha256"
          $expected = ((Get-Content -LiteralPath $checksumPath -Raw) -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash
          if ($actual -cne $expected.ToUpperInvariant()) {
            throw "SHA256 mismatch: expected $expected, got $actual"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: BDSubMerge-windows-x64
          path: |
            dist/BDSubMerge-*-windows-x64.zip
            dist/BDSubMerge-*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: BDSubMerge-windows-x64-visual-evidence
          path: |
            reports/package-ui/BDSubMerge-zh-light.png
            reports/package-ui/BDSubMerge-en-dark.png
          if-no-files-found: error

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install Linux GUI runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          sudo apt-get update
          sudo apt-get install --yes \
            fonts-noto-cjk libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 \
            xauth xvfb
      - name: Resolve project and release versions
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          if [[ "$project_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(b([1-9][0-9]*))?$ ]]; then
            release_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            if [[ -n "${BASH_REMATCH[5]:-}" ]]; then
              release_version+="-beta.${BASH_REMATCH[5]}"
            fi
          else
            echo "Unsupported stable or beta PEP 440 version: $project_version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME#v}" != "$release_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $project_version" >&2
            exit 1
          fi
          echo "BDSUBMERGE_VERSION=$project_version" >> "$GITHUB_ENV"
          echo "BDSUBMERGE_RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
      - name: Install project
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -c constraints/ci.txt ".[gui,packaging]"
      - name: Build onedir package
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed
          --name BDSubMerge
          --collect-data bdsubmerge
          --collect-all shinya
          --collect-all pysubs2
          src/bdsubmerge/app.py
      - name: Include and verify project license
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE dist/BDSubMerge/LICENSE
          required=(
            dist/BDSubMerge/BDSubMerge
            dist/BDSubMerge/_internal/bdsubmerge/resources/i18n/en_US.json
            dist/BDSubMerge/_internal/bdsubmerge/resources/i18n/zh_CN.json
            dist/BDSubMerge/LICENSE
          )
          for path in "${required[@]}"; do
            test -f "$path"
          done
          test ! -e dist/BDSubMerge/LICENSES
          test ! -e dist/BDSubMerge/THIRD_PARTY_NOTICES.md
      - name: Create tarball and SHA256
        shell: bash
        run: |
          set -euo pipefail
          archive="BDSubMerge-$BDSUBMERGE_RELEASE_VERSION-linux-x86_64.tar.gz"
          tar --create --gzip --file "dist/$archive" --directory dist BDSubMerge
          (cd dist && sha256sum "$archive" > "$archive.sha256")
      - name: Smoke-test final archive without system Python
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/BDSubMerge final package no Python"
          working_directory="$smoke_root/working directory"
          mkdir -p "$working_directory"
          tar --extract --gzip \
            --file "dist/BDSubMerge-$BDSUBMERGE_RELEASE_VERSION-linux-x86_64.tar.gz" \
            --directory "$smoke_root"
          executable="$smoke_root/BDSubMerge/BDSubMerge"
          test -x "$executable"
          env --ignore-environment \
            HOME="$HOME" PATH="/usr/bin:/bin" QT_QPA_PLATFORM=xcb \
            xvfb-run --auto-servernum "$executable" \
            --smoke-test --expect-version "$BDSUBMERGE_VERSION"
      - name: Capture final executable visual evidence
        shell: bash
        run: |
          set -euo pipefail
          executable="$RUNNER_TEMP/BDSubMerge final package no Python/BDSubMerge/BDSubMerge"
          working_directory="$RUNNER_TEMP/BDSubMerge final package no Python/working directory"
          evidence_root="$GITHUB_WORKSPACE/reports/package-ui-linux"
          mkdir -p "$evidence_root"
          for capture in "zh_CN light" "en_US dark"; do
            read -r locale theme <<< "$capture"
            destination="$evidence_root/BDSubMerge-$locale-$theme.png"
            (
              cd "$working_directory"
              env --ignore-environment \
                HOME="$HOME" PATH="/usr/bin:/bin" QT_QPA_PLATFORM=xcb \
                xvfb-run --auto-servernum "$executable" \
                --capture-screenshot "$destination" \
                --locale "$locale" --theme "$theme" \
                --expect-version "$BDSUBMERGE_VERSION"
            )
            test "$(stat --format=%s "$destination")" -ge 30000
          done
          test "$(sha256sum "$evidence_root"/*.png | awk '{print $1}' | sort -u | wc -l)" -eq 2
      - name: Verify release checksum
        working-directory: dist
        run: sha256sum --check "BDSubMerge-$BDSUBMERGE_RELEASE_VERSION-linux-x86_64.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: BDSubMerge-linux-x86_64
          path: |
            dist/BDSubMerge-*-linux-x86_64.tar.gz
            dist/BDSubMerge-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: BDSubMerge-linux-x86_64-visual-evidence
          path: reports/package-ui-linux/*.png
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [package-windows, package-linux]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: BDSubMerge-windows-x64
          path: release-files
      - uses: actions/download-artifact@v7
        with:
          name: BDSubMerge-linux-x86_64
          path: release-files
      - name: Verify downloaded release files
        working-directory: release-files
        run: sha256sum --check BDSubMerge-*.sha256
      - name: Require successful CI for the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          successful_runs="$(gh api \
            "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "No successful CI run exists for release commit $GITHUB_SHA" >&2
            exit 1
          fi
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_flags=(
            --verify-tag
            --title "BDSubMerge ${GITHUB_REF_NAME#v}"
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md"
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${release_flags[@]}" \
            release-files/BDSubMerge-*-windows-x64.zip \
            release-files/BDSubMerge-*-windows-x64.zip.sha256 \
            release-files/BDSubMerge-*-linux-x86_64.tar.gz \
            release-files/BDSubMerge-*-linux-x86_64.tar.gz.sha256
