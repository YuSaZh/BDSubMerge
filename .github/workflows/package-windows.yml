name: Package Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install ".[gui,packaging]"
      - name: Build onedir package
        run: pyinstaller --noconfirm --clean --onedir --windowed --name BDSubMerge src/bdsubmerge/app.py
      - name: Include notices
        shell: pwsh
        run: Copy-Item LICENSE,THIRD_PARTY_NOTICES.md -Destination dist/BDSubMerge
      - uses: actions/upload-artifact@v7
        with:
          name: BDSubMerge-windows-x64
          path: dist/BDSubMerge
